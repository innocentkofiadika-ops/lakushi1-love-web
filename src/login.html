
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | LAKUSHI1 LOVE WEB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#241820,#583044)}
.panel{background:#f7f1e8;width:min(100%,430px);padding:35px;border-radius:16px;box-shadow:0 15px 40px #0005}
h1{color:#64263b;text-align:center}
p{text-align:center;color:#66545c}
label{display:block;margin-top:16px;font-weight:bold}
input{width:100%;padding:13px;margin-top:7px;border:1px solid #c9bdb6;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:22px;background:#64263b;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
a{color:#64263b}
#msg{overflow-wrap:anywhere;line-height:1.5}
</style>
</head>
<body>
<main class="panel">
<h1>LAKUSHI1 LOVE WEB</h1>
<p>Welcome back. Your journey to meaningful love continues here.</p>
<form id="loginForm">
<label>Email address</label>
<input id="email" type="email" required autocomplete="email">
<label>Password</label>
<input id="password" type="password" required autocomplete="current-password">
<button type="submit">Log in</button>
</form>
<p id="msg"></p>
<p>New here? <a href="/signup.html">Create an account</a></p>
<p><a href="/">Back to home</a></p>
</main>
<script>
const SUPABASE_URL = "https://tbqvggbdwtkabkqrytor.supabase.co";
const SUPABASE_KEY = "sb_publishable_iIR-m_rhxRS4UqUPjI3LVw_EEByrXcf";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "Signing in...";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const {error} = await client.auth.signInWithPassword({email,password});
  if(error){
    msg.textContent = error.message;
    return;
  }
  window.location.href = "/dashboard.html";
});
</script>
</body>
</html>
